<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY7QUOTES | Introduction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Baskervville:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #0a0a0a; --paper: #f5f5f0; --accent: #c5b358; }
        body { background-color: var(--bg); color: var(--paper); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .serif { font-family: 'Baskervville', serif; }
        
        .nav-link { font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase; transition: 0.3s; }
        .nav-link:hover { color: var(--accent); }
        
        .btn-minimal { border: 1px solid rgba(255,255,255,0.1); padding: 1rem 2.5rem; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; transition: 0.4s; cursor: pointer; background: transparent; color: var(--paper); text-decoration: none; }
        .btn-minimal:hover { background: var(--paper); color: var(--bg); }

        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.3;
        }

        #mobileMenu { background-color: var(--bg); z-index: 100; }
        #quoteModal { background-color: rgba(10, 10, 10, 0.98); backdrop-filter: blur(10px); }
        .quote-card { border: 1px solid rgba(255, 255, 255, 0.05); background: #0f0f0f; }
    </style>
</head>
<body class="opacity-0 transition-opacity duration-1000" onload="document.body.style.opacity='1'">

    <canvas id="snow-canvas"></canvas>

    <nav class="fixed top-0 w-full z-50 p-6 md:p-10 flex justify-between items-center bg-[#0a0a0a]/80 backdrop-blur-md md:bg-transparent">
        <div class="flex items-center gap-3">
            <div class="w-1.5 h-1.5 bg-accent"></div>
            <a href="index.html" class="text-xs font-bold tracking-[0.4em] uppercase text-white no-underline">MY7QUOTES</a>
        </div>

        <div class="hidden md:flex gap-12">
            <a href="index.html" class="nav-link text-accent">Intro</a>
            <a href="archive.html" class="nav-link">Archive</a>
            <a href="about.html" class="nav-link">About</a>
        </div>

        <button onclick="toggleMobileMenu()" class="md:hidden flex flex-col gap-1.5 bg-transparent border-none cursor-pointer">
            <div class="w-6 h-[1px] bg-white"></div>
            <div class="w-6 h-[1px] bg-white"></div>
        </button>
    </nav>

    <div id="mobileMenu" class="fixed inset-0 hidden flex-col items-center justify-center gap-8">
        <button onclick="toggleMobileMenu()" class="absolute top-8 right-8 text-xs tracking-widest opacity-50 bg-transparent text-white border-none cursor-pointer">CLOSE</button>
        <a href="index.html" class="text-xl serif italic text-accent no-underline">Intro</a>
        <a href="archive.html" class="text-xl serif italic text-white no-underline">Archive</a>
        <a href="about.html" class="text-xl serif italic text-white no-underline">About</a>
    </div>

    <section class="min-h-screen flex items-center px-8 md:px-24">
        <div class="max-w-4xl">
            <span class="text-accent text-[0.6rem] tracking-[0.6em] uppercase mb-8 block">Project Collection 01</span>
            <h1 class="serif text-5xl md:text-8xl mb-10 leading-[1.1]">Hard truths <br> for <span class="italic text-gray-500">quiet</span> nights.</h1>
            <p class="text-gray-500 text-lg max-w-xl mb-12 font-light leading-relaxed">A digital library of life, love, and the inevitable breakups. Curated for those who prefer truth over comfort.</p>
            
            <div class="flex flex-col sm:flex-row gap-6">
                <a href="archive.html" class="btn-minimal inline-block text-center">Enter Repository</a>
                <button onclick="showRandomQuote()" class="btn-minimal">Quick Insight</button>
            </div>
        </div>
    </section>

    <div id="quoteModal" class="fixed inset-0 z-[101] flex items-center justify-center p-6 opacity-0 pointer-events-none transition-opacity duration-500">
        <div class="quote-card max-w-xl w-full p-8 md:p-16 relative">
            <button onclick="closeModal()" class="absolute top-6 right-8 text-accent text-xs tracking-widest hover:text-white transition bg-transparent border-none cursor-pointer">CLOSE</button>
            <span id="fragmentLabel" class="text-accent/40 text-[0.6rem] tracking-[0.4em] uppercase block mb-10">Fragment_Random</span>
            <div id="quoteDisplay" class="serif text-2xl md:text-4xl italic leading-tight text-paper mb-12"></div>
            <div class="flex justify-between items-center border-t border-white/5 pt-8">
                <span class="text-[0.5rem] tracking-[0.3em] uppercase opacity-30">M7Q Archive</span>
                <button onclick="showRandomQuote()" class="text-[0.55rem] tracking-widest uppercase text-accent hover:text-white transition bg-transparent border-none cursor-pointer">New Insight</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
    // 1. Configuration & Global State
    const supabaseUrl = window.env?.SUPABASE_URL;
    const supabaseKey = window.env?.SUPABASE_ANON_KEY;
    const FALLBACK_JSON_URL = "https://raw.githubusercontent.com/CPKhanal/My7Quotes/main/quotes.json";
    
    let _supabase = null;
    let _cachedQuotes = null; // Stores GitHub JSON if Supabase fails

    if (supabaseUrl && supabaseKey) {
        _supabase = supabase.createClient(supabaseUrl, supabaseKey);
    } else {
        console.warn("Supabase credentials missing. Project will rely on GitHub Archive.");
    }

    // 2. Falling Background Effect (Canvas)
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    
    function resize() { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5 + 0.5;
            this.speed = Math.random() * 0.4 + 0.1;
            this.opacity = Math.random() * 0.5 + 0.1;
        }
        update() {
            this.y += this.speed;
            if (this.y > canvas.height) { 
                this.y = -10; 
                this.x = Math.random() * canvas.width; 
            }
        }
        draw() {
            ctx.fillStyle = `rgba(245, 245, 240, ${this.opacity})`;
            ctx.beginPath(); 
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
            ctx.fill();
        }
    }

    for(let i = 0; i < 100; i++) particles.push(new Particle());

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();

    // 3. Mobile Navigation Logic
    function toggleMobileMenu() {
        const menu = document.getElementById('mobileMenu');
        if(menu.classList.contains('hidden')) {
            menu.classList.remove('hidden');
            menu.classList.add('flex');
            gsap.from(menu.children, { opacity: 0, y: 20, stagger: 0.1 });
        } else {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
        }
    }

    // 4. Enhanced Random Quote Logic (Supabase with GitHub Fallback)
    async function showRandomQuote() {
        const display = document.getElementById('quoteDisplay');
        const modal = document.getElementById('quoteModal');
        const label = document.getElementById('fragmentLabel');
        
        display.innerText = "Consulting the archive...";
        modal.classList.remove('pointer-events-none');
        gsap.to(modal, { opacity: 1, duration: 0.6 });

        let finalQuote = null;

        // --- Try Supabase First ---
        if (_supabase) {
            try {
                const randomOffset = Math.floor(Math.random() * 213);
                const { data, error } = await _supabase
                    .from('quotes')
                    .select('id, content')
                    .range(randomOffset, randomOffset)
                    .single();

                if (!error && data) {
                    finalQuote = { id: data.id, content: data.content };
                }
            } catch (err) {
                console.error("Supabase Error:", err);
            }
        }

        // --- Fallback to GitHub JSON if Supabase failed or returned null ---
        if (!finalQuote) {
            try {
                if (!_cachedQuotes) {
                    const response = await fetch(FALLBACK_JSON_URL);
                    _cachedQuotes = await response.json();
                }
                
                const randomIndex = Math.floor(Math.random() * _cachedQuotes.length);
                const selected = _cachedQuotes[randomIndex];
                
                finalQuote = {
                    id: selected.id || "LCL",
                    content: selected.content || selected.quote // Handles varied JSON keys
                };
            } catch (err) {
                console.error("Fallback Archive failed:", err);
            }
        }

        // --- Update UI ---
        if (finalQuote) {
            display.innerText = `"${finalQuote.content}"`;
            label.innerText = `Fragment_#${finalQuote.id}`;
        } else {
            display.innerText = "The archive is temporarily silent.";
            label.innerText = "Fragment_Error";
        }
    }

    function closeModal() {
        const modal = document.getElementById('quoteModal');
        gsap.to(modal, { 
            opacity: 0, 
            duration: 0.4, 
            onComplete: () => modal.classList.add('pointer-events-none') 
        });
    }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker Registered'))
        .catch(err => console.log('Service Worker Failed', err));
    });
  }
</script>
</body>
</html>
