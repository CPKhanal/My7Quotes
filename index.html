        function updateHeader() {
            document.getElementById('quote-count').innerText = `${quotes.length} TRUTHS LOADED`;

        function renderQuotes(data) {
            const grid = document.getElementById('quotesGrid');
            grid.innerHTML = '';
            
            data.forEach((text, index) => {
                const card = document.createElement('div');
                card.className = 'quote-card p-10 rounded-2xl relative flex flex-col justify-between opacity-0 translate-y-10';
                
                card.innerHTML = `
                    <div class="relative z-10">
                        <span class="text-[6rem] absolute -top-10 -right-4 font-black text-white/[0.03] select-none pointer-events-none serif">
                            ${String(index + 1).padStart(2, '0')}
                        </span>
                        <p class="serif text-xl md:text-2xl leading-relaxed mb-6 italic">"${text}"</p>
                    </div>
                    <div class="pt-6 border-t border-white/5 flex justify-between items-center">
                        <span class="text-[10px] uppercase tracking-[0.3em] text-indigo-400 font-bold">Cold Wisdom</span>
                        <button class="opacity-30 hover:opacity-100 transition copy-btn" data-text="${text}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                        </button>
                    </div>
                `;
                grid.appendChild(card);

                gsap.to(card, {
                    scrollTrigger: {
                        trigger: card,
                        start: "top 90%",
                        toggleActions: "play none none reverse"
                    },
                    opacity: 1,
                    y: 0,
                    duration: 0.8,
                    ease: "power2.out"
                });
            });

            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.onclick = (e) => {
                    const txt = e.currentTarget.getAttribute('data-text');
                    copyToClipboard(txt);
                };
            });
        }

        }

        function initSearch() {
            const input = document.getElementById('searchInput');
            input.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = quotes.filter(q => q.toLowerCase().includes(term));
                renderQuotes(filtered);
                document.getElementById('results-meta').innerText = 
                    term ? `Found ${filtered.length} matches` : 'Showing all entries';
            });
        }

        function getRandomQuote() {
            const index = Math.floor(Math.random() * quotes.length);
            const text = quotes[index];
            const modal = document.getElementById('quoteModal');
            const modalText = document.getElementById('modalQuoteText');
            
            modalText.innerText = `"${text}"`;
            modal.classList.remove('pointer-events-none');
            gsap.to(modal, { opacity: 1, duration: 0.4 });
        }

        function closeModal() {
            const modal = document.getElementById('quoteModal');
            gsap.to(modal, { 
                opacity: 0, 
                duration: 0.3, 
                onComplete: () => modal.classList.add('pointer-events-none') 
            });
        }

        function scrollToContent() {
            document.getElementById('content').scrollIntoView({ behavior: 'smooth' });
        }

        function copyToClipboard(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-10 left-1/2 -translate-x-1/2 bg-indigo-600 text-white px-6 py-2 rounded-full z-[200] text-sm';
            toast.innerText = 'Copied to clipboard';
            document.body.appendChild(toast);
            gsap.from(toast, { y: 20, opacity: 0 });
            gsap.to(toast, { y: -20, opacity: 0, delay: 2, onComplete: () => toast.remove() });
        }

        function initBackgroundAnimation() {
            const canvas = document.getElementById('hero-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2;
                    this.speedX = (Math.random() - 0.5) * 0.5;
                    this.speedY = (Math.random() - 0.5) * 0.5;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x > canvas.width) this.x = 0;
                    if (this.x < 0) this.x = canvas.width;
                    if (this.y > canvas.height) this.y = 0;
                    if (this.y < 0) this.y = canvas.height;
                }
                draw() {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function init() {
                particles = [];
                for (let i = 0; i < 100; i++) {
                    particles.push(new Particle());
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resize);
            resize();
            init();
            animate();
        }
    </script>
</body>
</html>
