name: Sync Quotes Data

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Updated to v5 to match Node 24 runners
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Fetch Quotes from Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/quotes?select=*" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" | jq . > quotes.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add quotes.json
          
          if git diff --cached --quiet; then
            echo "No new quotes to sync."
          else
            git commit -m "Update quotes.json from Supabase"
            git push
          fi
